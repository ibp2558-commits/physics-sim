<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>놀이기구의 운동과 속도 벡터</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; background-color: #e0f7fa; margin: 0; padding: 20px; }
        h2 { color: #333; margin-bottom: 10px; }
        .controls { margin-bottom: 20px; font-weight: bold; color: #444; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: 0 auto; position: relative; }
        .canvas-container { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        canvas { background: #87CEEB; border-radius: 8px; width: 100%; height: 250px; display: block; }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #222; }
        
        /* 시작 버튼 오버레이 */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 10; border-radius: 12px; }
        button.play-btn { font-size: 24px; padding: 15px 40px; background: #ff5722; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(255,87,34,0.4); transition: transform 0.2s; }
        button.play-btn:hover { transform: scale(1.05); background: #e64a19; }
    </style>
</head>
<body>

    <h2>🎢 놀이기구의 운동과 속도(빨간색 화살표)</h2>
    <div class="controls">
        <label>재생 속도 조절: <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.1" value="1.0"></label>
        <span id="speedValue" style="display:inline-block; width: 40px;">1.0x</span>
    </div>

    <div class="grid">
        <div id="overlay"><button class="play-btn" onclick="startSim()">▶ 시뮬레이션 시작</button></div>
        
        <div class="canvas-container">
            <h3>1. 자이로드롭 (직선 가속)</h3>
            <canvas id="canvas1" width="350" height="250"></canvas>
        </div>
        <div class="canvas-container">
            <h3>2. 직선 미끄럼틀 (빗면 가속)</h3>
            <canvas id="canvas2" width="350" height="250"></canvas>
        </div>
        <div class="canvas-container">
            <h3>3. 대관람차 (등속 원운동)</h3>
            <canvas id="canvas3" width="350" height="250"></canvas>
        </div>
        <div class="canvas-container">
            <h3>4. 바이킹 (진자 운동)</h3>
            <canvas id="canvas4" width="350" height="250"></canvas>
        </div>
    </div>

    <script>
        let isRunning = false;
        let t = 0;
        const canvases = [
            document.getElementById('canvas1'), document.getElementById('canvas2'),
            document.getElementById('canvas3'), document.getElementById('canvas4')
        ];
        const ctxs = canvases.map(c => c.getContext('2d'));
        
        // 속도 조절기 텍스트 업데이트
        document.getElementById('speedSlider').addEventListener('input', function() {
            document.getElementById('speedValue').innerText = this.value + 'x';
        });

        // 시뮬레이션 시작
        function startSim() {
            document.getElementById('overlay').style.display = 'none';
            if (!isRunning) {
                isRunning = true;
                requestAnimationFrame(animate);
            }
        }

        // 벡터 화살표 그리기 함수 (빛 번짐 효과 포함)
        function drawArrow(ctx, x, y, vx, vy) {
            const len = Math.sqrt(vx*vx + vy*vy);
            if (len < 0.1) return; // 속도가 0에 가까우면 그리지 않음
            
            const scale = 1.2; // 화살표 길이 비율
            const endX = x + vx * scale;
            const endY = y + vy * scale;
            const headlen = 12; // 화살표 머리 크기
            const angle = Math.atan2(vy, vx);
            
            ctx.shadowBlur = 5;
            ctx.shadowColor = "red";
            
            // 몸통
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 머리
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fillStyle = '#ff0000';
            ctx.fill();
            
            ctx.shadowBlur = 0; // 초기화
            
            // 중심점 표시
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI*2);
            ctx.fillStyle = '#000';
            ctx.fill();
        }

        // 애니메이션 루프
        function animate() {
            let speed = parseFloat(document.getElementById('speedSlider').value);
            t += 0.04 * speed;

            ctxs.forEach(ctx => ctx.clearRect(0, 0, 350, 250));

            // 1. 자이로드롭 (y축 가속도 운동)
            let y1 = 125 + 90 * Math.sin(t);
            let vy1 = 90 * Math.cos(t);
            ctxs[0].fillStyle = '#555';
            ctxs[0].fillRect(165, 20, 20, 210); // 기둥
            ctxs[0].fillStyle = '#ffeb3b';
            ctxs[0].fillRect(150, y1 - 10, 50, 20); // 탑승구
            drawArrow(ctxs[0], 175, y1, 0, vy1);

            // 2. 직선 미끄럼틀 (대각선 가속도 운동)
            let pos = (Math.sin(t) + 1) / 2; 
            let x2 = 60 + pos * 180;
            let y2 = 60 + pos * 140;
            let vx2 = 90 * Math.cos(t); 
            let vy2 = 70 * Math.cos(t);
            ctxs[1].beginPath(); ctxs[1].moveTo(60, 60); ctxs[1].lineTo(240, 200); 
            ctxs[1].lineWidth=6; ctxs[1].strokeStyle='#888'; ctxs[1].stroke();
            ctxs[1].fillStyle = '#ffeb3b';
            ctxs[1].beginPath(); ctxs[1].arc(x2, y2, 15, 0, Math.PI*2); ctxs[1].fill();
            drawArrow(ctxs[1], x2, y2, vx2, vy2);

            // 3. 대관람차 (등속 원운동)
            let x3 = 175 + 80 * Math.cos(t * 0.7);
            let y3 = 125 + 80 * Math.sin(t * 0.7);
            let vx3 = -56 * Math.sin(t * 0.7);
            let vy3 = 56 * Math.cos(t * 0.7);
            ctxs[2].beginPath(); ctxs[2].arc(175, 125, 80, 0, Math.PI*2); 
            ctxs[2].lineWidth=3; ctxs[2].strokeStyle='#555'; ctxs[2].stroke();
            ctxs[2].fillStyle = '#ffeb3b';
            ctxs[2].beginPath(); ctxs[2].arc(x3, y3, 15, 0, Math.PI*2); ctxs[2].fill();
            drawArrow(ctxs[2], x3, y3, vx3, vy3);

            // 4. 바이킹 (진자 운동 - 방향과 속력 모두 변화)
            let theta = (Math.PI / 2.5) * Math.sin(t);
            let x4 = 175 + 160 * Math.sin(theta);
            let y4 = -30 + 160 * Math.cos(theta);
            let omega = (Math.PI / 2.5) * Math.cos(t);
            let vx4 = 160 * Math.cos(theta) * omega;
            let vy4 = -160 * Math.sin(theta) * omega;
            ctxs[3].beginPath(); ctxs[3].moveTo(175, -30); ctxs[3].lineTo(x4, y4); 
            ctxs[3].lineWidth=3; ctxs[3].strokeStyle='#555'; ctxs[3].stroke();
            ctxs[3].fillStyle = '#ffeb3b';
            ctxs[3].fillRect(x4 - 25, y4 - 15, 50, 30);
            drawArrow(ctxs[3], x4, y4, vx4, vy4);

            requestAnimationFrame(animate);
        }
        
        // 정지된 상태로 초기 화면 한 번만 렌더링
        let tempT = t;
        t = 1.5; 
        animate(); 
        t = tempT;
        isRunning = false; 
    </script>
</body>
</html>
