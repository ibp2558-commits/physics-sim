<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>놀이공원 운동 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f0f9ff;
            background-image: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
        }
        h1, .fun-font { font-family: 'Jua', sans-serif; }
        
        #canvas-container {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16/9;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #7dd3fc 0%, #38bdf8 50%, #84cc16 50%, #4d7c0f 100%);
        }
        
        .tab-btn {
            background-color: #ffffff; color: #4b5563;
            border: 2px solid #e5e7eb;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }
        .tab-btn.active {
            background-color: #3b82f6; color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);
            border-color: #2563eb;
        }
        .tab-btn:hover:not(.active) {
            background-color: #f8fafc; border-color: #cbd5e1;
        }
        
        /* Slider Styling */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 26px; width: 26px;
            border-radius: 50%; background: #ef4444; cursor: pointer;
            margin-top: -9px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); border: 2px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 10px; cursor: pointer;
            background: #cbd5e1; border-radius: 5px;
        }
    </style>
</head>
<body class="flex flex-col p-4 md:p-6 items-center">

    <!-- Header -->
    <header class="text-center mb-6 mt-2">
        <h1 class="text-4xl md:text-5xl text-blue-900 mb-3 drop-shadow-md">🎢 물리 놀이공원: 운동 분석</h1>
        <p class="text-md md:text-lg text-blue-900 font-bold bg-white/70 inline-block px-6 py-2 rounded-full shadow-sm">
            빨간색 <span class="text-red-600 text-xl font-black">화살표(속도 벡터)</span>의 <span class="underline decoration-wavy decoration-blue-500">길이(속력)</span>와 <span class="underline decoration-wavy decoration-blue-500">방향(운동 방향)</span>을 관찰하세요!
        </p>
    </header>

    <!-- Tabs (Simple list of 4 rides) -->
    <div class="flex flex-wrap justify-center gap-3 mb-6 max-w-[1100px] w-full fun-font">
        <button onclick="setRide(0)" id="tab-0" class="tab-btn active text-xl md:text-2xl py-4 px-6 rounded-2xl flex-1 min-w-[200px]">⬇️ 자이로드롭</button>
        <button onclick="setRide(1)" id="tab-1" class="tab-btn text-xl md:text-2xl py-4 px-6 rounded-2xl flex-1 min-w-[200px]">↘️ 직선 미끄럼틀</button>
        <button onclick="setRide(2)" id="tab-2" class="tab-btn text-xl md:text-2xl py-4 px-6 rounded-2xl flex-1 min-w-[200px]">🎡 대관람차</button>
        <button onclick="setRide(3)" id="tab-3" class="tab-btn text-xl md:text-2xl py-4 px-6 rounded-2xl flex-1 min-w-[200px]">⛵ 바이킹</button>
    </div>

    <!-- Simulation Canvas -->
    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
        
        <!-- 캔버스 위 대형 재생 버튼 오버레이 추가 -->
        <div id="playOverlay" class="absolute inset-0 bg-black/20 flex flex-col items-center justify-center z-10 backdrop-blur-[2px]">
            <button onclick="togglePlay()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-4xl font-bold py-6 px-10 rounded-full shadow-2xl transition-transform transform hover:scale-110 border-4 border-white flex items-center gap-3">
                ▶️ 시뮬레이션 시작
            </button>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="bg-white rounded-2xl shadow-xl p-5 mt-5 max-w-[1100px] w-full border border-blue-100 flex flex-col md:flex-row items-center gap-4">
        
        <!-- Speed Slider -->
        <div class="flex-1 w-full flex flex-col justify-center bg-blue-50/50 border border-blue-100 p-4 rounded-xl">
            <div class="flex justify-between items-center mb-3">
                <label class="text-lg font-bold text-gray-700 flex items-center gap-2">
                    ⏱️ 관찰 속도 <span id="speedValue" class="text-red-600 bg-red-50 font-black px-3 py-1 rounded-md text-base border border-red-200 shadow-sm">0.5x (느리게)</span>
                </label>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-500 font-bold">0.1x</span>
                <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.1" value="0.5" oninput="updateSpeed(this.value)">
                <span class="text-sm text-gray-500 font-bold">2.0x</span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex flex-wrap justify-center gap-3 w-full md:w-auto fun-font">
            <button onclick="togglePlay()" id="playBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white text-2xl py-4 px-8 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1">
                ▶️ 재생
            </button>
            <button onclick="resetSim()" class="bg-slate-500 hover:bg-slate-600 text-white text-2xl py-4 px-8 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1">
                🔄 초기화
            </button>
            <button onclick="toggleExplanation()" id="expBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-2xl py-4 px-8 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1">
                💡 정답 해설
            </button>
        </div>
    </div>

    <!-- Explanation Box -->
    <div id="explanationBox" class="hidden max-w-[1100px] w-full mt-4 bg-amber-50 border-2 border-amber-400 p-6 rounded-2xl shadow-lg relative overflow-hidden">
        <div class="absolute top-0 left-0 w-3 h-full bg-amber-400"></div>
        <h3 id="expTitle" class="text-3xl font-bold text-gray-800 mb-3 fun-font">해설</h3>
        <p id="expText" class="text-xl text-gray-700 leading-relaxed font-medium"></p>
        <div class="mt-5 inline-block bg-white border border-red-200 p-4 rounded-xl shadow-sm">
            <p id="expHighlight" class="text-2xl font-extrabold text-red-600"></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        // Logical canvas resolution
        const L_WIDTH = 1100;
        const L_HEIGHT = 618; // 16:9
        
        function resizeCanvas() {
            canvas.width = L_WIDTH;
            canvas.height = L_HEIGHT;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let currentRide = 0; 
        let isPlaying = false;
        let time = 0;
        let speedMultiplier = 0.5;
        let animationId;
        let showExp = false;

        const explanations = [
            {
                title: "⬇️ 자이로드롭 (자유 낙하)",
                text: "중력을 받아 아래로 떨어지면서 점점 빨라집니다. 화살표의 방향은 항상 '아래'를 향하지만, 길이는 점점 길어집니다.",
                highlight: "🎯 속력 변함 (O), 운동 방향 변함 (X)"
            },
            {
                title: "↘️ 직선 미끄럼틀 (빗면에서의 운동)",
                text: "경사면을 따라 미끄러져 내려오며 점점 빨라집니다. 화살표는 빗면과 나란한 방향으로 일정하지만, 길이는 점점 길어집니다.",
                highlight: "🎯 속력 변함 (O), 운동 방향 변함 (X)"
            },
            {
                title: "🎡 대관람차 (등속 원운동)",
                text: "일정한 빠르기로 원을 그립니다. 화살표의 길이(속력)는 일정하지만, 원의 접선 방향을 따라 화살표의 방향이 매 순간 계속 바뀝니다.",
                highlight: "🎯 속력 변함 (X), 운동 방향 변함 (O)"
            },
            {
                title: "⛵ 바이킹 (진자 운동)",
                text: "양 끝으로 갈수록 느려지고(화살표 짧아짐) 가운데를 지날 때 가장 빠릅니다(화살표 가장 긺). 곡선 궤도를 따라 움직이므로 화살표의 방향도 쉴 새 없이 바뀝니다.",
                highlight: "🎯 속력 변함 (O), 운동 방향 변함 (O)"
            }
        ];

        // --- Core Drawing Functions --- //
        
        function drawArrow(ctx, fromX, fromY, toX, toY, color='#ef4444', width=8) {
            const headlen = 28; 
            const dx = toX - fromX;
            const dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            const length = Math.hypot(dx, dy);
            
            if(length < 1) return; // Prevent drawing glitch at 0 velocity

            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 0, 0, 0.8)'; // Strong red glow
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 7), toY - headlen * Math.sin(angle - Math.PI / 7));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 7), toY - headlen * Math.sin(angle + Math.PI / 7));
            
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.stroke();
            
            // Start dot (Center of mass indicator)
            ctx.beginPath();
            ctx.arc(fromX, fromY, width/2 + 2, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.restore();
        }

        function drawClouds(ctx) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            const clouds = [{x: 200, y: 120, s: 1}, {x: 850, y: 150, s: 1.3}, {x: 550, y: 80, s: 0.8}];
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 35*c.s, Math.PI*0.5, Math.PI*1.5);
                ctx.arc(c.x+40*c.s, c.y-25*c.s, 45*c.s, Math.PI*1, Math.PI*2);
                ctx.arc(c.x+80*c.s, c.y-10*c.s, 40*c.s, Math.PI*1.2, Math.PI*0);
                ctx.arc(c.x+100*c.s, c.y, 35*c.s, Math.PI*1.5, Math.PI*0.5);
                ctx.fill();
            });
        }

        // --- Ride Implementations --- //
        
        function renderScene() {
            ctx.clearRect(0, 0, L_WIDTH, L_HEIGHT);
            drawClouds(ctx);

            if (currentRide === 0) {
                // 1. 자이로드롭 (Drop Tower)
                const cx = L_WIDTH / 2;
                const startY = 80;
                const floorY = L_HEIGHT - 60; 
                const g = 0.25; 
                let t = time;
                let y = startY;
                let vy = 0;
                
                if (t > 40) { // Wait at top
                    let fallT = t - 40;
                    y = startY + 0.5 * g * fallT * fallT;
                    vy = g * fallT;
                }
                if (y > floorY - 30) { // Hit bottom
                    y = floorY - 30;
                    vy = 0; 
                    if (isPlaying && t > 250) time = 0; // Loop automatically
                }

                // Tower structure
                ctx.fillStyle = "#94a3b8";
                ctx.fillRect(cx - 30, 40, 60, floorY - 20);
                ctx.fillStyle = "#cbd5e1";
                for(let i=50; i<floorY; i+=40) ctx.fillRect(cx - 30, i, 60, 10);
                
                // Carriage / Seats
                ctx.fillStyle = "#f59e0b";
                ctx.fillRect(cx - 80, y - 15, 160, 30);
                for(let i=0; i<5; i++) { // People represented as circles
                    ctx.fillStyle = ['#3b82f6', '#10b981', '#ef4444', '#a855f7', '#ec4899'][i];
                    ctx.beginPath(); ctx.arc(cx - 60 + i*30, y - 25, 15, 0, Math.PI*2); ctx.fill();
                }

                // Velocity Vector
                if (vy > 0) drawArrow(ctx, cx, y, cx, y + vy * 8);

            } else if (currentRide === 1) {
                // 2. 직선 미끄럼틀 (Straight Slide)
                const startX = 200, startY = 150;
                const endX = 800, endY = L_HEIGHT - 80;
                const dx = endX - startX;
                const dy = endY - startY;
                const angle = Math.atan2(dy, dx);
                const totalDist = Math.hypot(dx, dy);
                
                const a = 0.15; // acceleration down the slope
                let t = time;
                let s = 0, v = 0;
                
                if(t > 30) {
                    let slideT = t - 30;
                    s = 0.5 * a * slideT * slideT;
                    v = a * slideT;
                }
                
                if (s > totalDist) {
                    s = totalDist;
                    v = 0;
                    if(isPlaying && t > 250) time = 0;
                }

                const currentX = startX + s * Math.cos(angle);
                const currentY = startY + s * Math.sin(angle);

                // Draw Support Structure
                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 15;
                ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(startX, L_HEIGHT); ctx.stroke(); 
                
                // Slide surface
                ctx.strokeStyle = "#facc15"; ctx.lineWidth = 25; ctx.lineCap = "round";
                ctx.beginPath(); ctx.moveTo(startX - 20, startY - 10); ctx.lineTo(endX + 30, endY + 15); ctx.stroke();
                
                // Person sliding
                ctx.save();
                ctx.translate(currentX, currentY);
                ctx.rotate(angle);
                ctx.fillStyle = "#3b82f6";
                ctx.fillRect(-20, -35, 40, 30); // Body
                ctx.beginPath(); ctx.arc(0, -45, 15, 0, Math.PI*2); ctx.fillStyle = "#fca5a5"; ctx.fill(); // Head
                ctx.restore();

                // Velocity Vector
                if (v > 0) {
                    drawArrow(ctx, currentX, currentY - 20, currentX + v * Math.cos(angle) * 8, currentY - 20 + v * Math.sin(angle) * 8);
                }

            } else if (currentRide === 2) {
                // 3. 대관람차 (Ferris Wheel)
                const cx = L_WIDTH / 2, cy = L_HEIGHT / 2 - 30, R = 200;
                const omega = 0.015; 
                const thetaOffset = time * omega;

                // Support base
                ctx.fillStyle = "#cbd5e1";
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 150, L_HEIGHT); ctx.lineTo(cx + 150, L_HEIGHT); ctx.fill();

                // Wheels frames
                ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 15; ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, R - 20, 0, Math.PI * 2); ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 5; ctx.stroke();
                
                let targetX = 0, targetY = 0, targetVx = 0, targetVy = 0;
                const numCabins = 12;

                for(let i=0; i<numCabins; i++) {
                    const angle = thetaOffset + (Math.PI * 2 / numCabins) * i;
                    const cabinX = cx + R * Math.cos(angle);
                    const cabinY = cy + R * Math.sin(angle);
                    
                    // Spoke lines
                    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cabinX, cabinY); ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 3; ctx.stroke();

                    // Cabin graphics
                    ctx.fillStyle = i === 0 ? "#ef4444" : "#60a5fa"; // Highlight first cabin
                    ctx.beginPath(); ctx.roundRect(cabinX - 25, cabinY - 5, 50, 45, 10); ctx.fill();
                    ctx.fillStyle = "white"; ctx.fillRect(cabinX - 15, cabinY + 5, 30, 20); // Window

                    // Capture physics for highlighted cabin
                    if (i === 0) {
                        targetX = cabinX; targetY = cabinY + 20;
                        targetVx = -R * omega * Math.sin(angle);
                        targetVy = R * omega * Math.cos(angle);
                    }
                }
                
                // Center hub
                ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI*2); ctx.fillStyle = "#ef4444"; ctx.fill();
                
                // Velocity Vector
                drawArrow(ctx, targetX, targetY, targetX + targetVx * 35, targetY + targetVy * 35);

            } else if (currentRide === 3) {
                // 4. 바이킹 (Viking Ship)
                const cx = L_WIDTH / 2, cy = 80, L = 380;
                const maxTheta = Math.PI / 2.3; 
                const omega0 = 0.035; 
                const theta = maxTheta * Math.cos(omega0 * time);
                
                const x = cx + L * Math.sin(theta);
                const y = cy + L * Math.cos(theta);
                const dTheta = -maxTheta * omega0 * Math.sin(omega0 * time);
                
                const vx = L * Math.cos(theta) * dTheta;
                const vy = -L * Math.sin(theta) * dTheta;

                // Support A-frame
                ctx.fillStyle = "#64748b";
                ctx.beginPath(); ctx.moveTo(cx, cy - 20); ctx.lineTo(cx - 200, L_HEIGHT); ctx.lineTo(cx - 130, L_HEIGHT); ctx.lineTo(cx, cy + 50); ctx.fill();
                ctx.beginPath(); ctx.moveTo(cx, cy - 20); ctx.lineTo(cx + 200, L_HEIGHT); ctx.lineTo(cx + 130, L_HEIGHT); ctx.lineTo(cx, cy + 50); ctx.fill();

                // Arm
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y - 50); ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 12; ctx.stroke();

                // Pivot point
                ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI*2); ctx.fillStyle = "#1e293b"; ctx.fill();

                // Viking Boat Shape
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(-theta); 
                
                ctx.beginPath();
                ctx.moveTo(-150, -60);
                ctx.bezierCurveTo(-150, 60, 150, 60, 150, -60); 
                ctx.lineTo(170, -80); 
                ctx.bezierCurveTo(150, 30, -150, 30, -170, -80); 
                ctx.closePath();
                ctx.fillStyle = '#8b5cf6'; ctx.fill();
                ctx.lineWidth = 5; ctx.strokeStyle = '#4c1d95'; ctx.stroke();

                // Ship decorations (Shields)
                for(let i=0; i<7; i++) { 
                    ctx.beginPath(); ctx.arc(-120 + i*40, -15, 14, 0, Math.PI*2);
                    ctx.fillStyle = ['#fde047', '#f87171', '#60a5fa'][i%3]; ctx.fill();
                    ctx.lineWidth = 2; ctx.strokeStyle = '#333'; ctx.stroke();
                }
                ctx.restore();

                // Velocity Vector
                drawArrow(ctx, x, y, x + vx * 10, y + vy * 10);
            }
        }

        // --- Engine & Controls --- //
        
        function animate() {
            if (isPlaying) time += speedMultiplier;
            renderScene();
            animationId = requestAnimationFrame(animate);
        }

        function updateSpeed(val) {
            speedMultiplier = parseFloat(val);
            const speedLabel = document.getElementById('speedValue');
            if(speedMultiplier < 1) speedLabel.innerText = `${speedMultiplier.toFixed(1)}x (느리게)`;
            else if (speedMultiplier === 1.0) speedLabel.innerText = `1.0x (보통)`;
            else speedLabel.innerText = `${speedMultiplier.toFixed(1)}x (빠르게)`;
        }

        function setRide(index) {
            currentRide = index;
            time = 0;
            isPlaying = false; // 자동 재생 해제
            
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const playBtn = document.getElementById('playBtn');
            playBtn.innerHTML = "▶️ 재생";
            playBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
            playBtn.classList.replace('hover:bg-amber-600', 'hover:bg-emerald-600');

            showExp = false;
            document.getElementById('explanationBox').classList.add('hidden');
            
            // 탭 변경 시 오버레이 다시 표시
            const overlay = document.getElementById('playOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            renderScene();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const playBtn = document.getElementById('playBtn');
            const overlay = document.getElementById('playOverlay');

            if (isPlaying) {
                playBtn.innerHTML = "⏸ 일시정지";
                playBtn.classList.replace('bg-emerald-500', 'bg-amber-500');
                playBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-amber-600');
                
                // 재생 시 오버레이 숨기기
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            } else {
                playBtn.innerHTML = "▶️ 재생";
                playBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
                playBtn.classList.replace('hover:bg-amber-600', 'hover:bg-emerald-600');
            }
        }

        function resetSim() {
            time = 0;
            isPlaying = false;
            
            const playBtn = document.getElementById('playBtn');
            playBtn.innerHTML = "▶️ 재생";
            playBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
            playBtn.classList.replace('hover:bg-amber-600', 'hover:bg-emerald-600');
            
            // 초기화 시 오버레이 다시 표시
            const overlay = document.getElementById('playOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            renderScene();
        }

        function toggleExplanation() {
            showExp = !showExp;
            const expBox = document.getElementById('explanationBox');
            if (showExp) {
                document.getElementById('expTitle').innerText = explanations[currentRide].title;
                document.getElementById('expText').innerText = explanations[currentRide].text;
                document.getElementById('expHighlight').innerText = explanations[currentRide].highlight;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }
        }

        // Initialize
        updateSpeed(document.getElementById('speedSlider').value);
        setRide(0); // Start with Drop Tower, auto-plays
        animate();

    </script>
</body>
</html>
